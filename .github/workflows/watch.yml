# Cloud watcher: runs whether or not your Mac is on.
#
# Setup:
#   1. Push to a PRIVATE GitHub repo.
#   2. Settings > Secrets and variables > Actions:
#        TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   3. Turn off the Mac job so alerts do not arrive twice:
#        launchctl bootout gui/$(id -u)/com.pmintern.watcher
#
# Budget: GitHub bills each job rounded UP to the nearest minute, so run
# COUNT is the cost. This asks for ~3,875 runs/month, but GitHub has been
# delivering ~12% of what is requested, which lands around 460 minutes of the
# 3,000 GitHub Pro includes. Check real usage with `gh run list` before
# assuming the requested number is what you are paying for.
name: Internship Watcher

on:
  schedule:
    # Runs hourly
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Send new postings as one summary message (for backfills)"
        type: boolean
        default: false

concurrency:
  group: internship-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # the tracker commit needs push access
      pages: write        # needed for upload-pages-artifact
      id-token: write     # needed for upload-pages-artifact
    timeout-minutes: 10    # ~560 boards take ~2.5 min; still capped so a hang can't run away
    steps:
      - uses: actions/checkout@v4

      # No setup-python step: ubuntu-latest ships python3 and this project is
      # standard-library only. Skipping it saves ~15s of billed time per run.

      # jobs.db is the dedupe ledger -- without it every run re-alerts
      # everything. .cache holds the ETag for the 11MB community feed, which
      # turns a full download into a 304 and keeps runs under the 1-minute
      # billing boundary.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            jobs.db
            .cache
          key: internship-state-${{ github.run_id }}
          restore-keys: internship-state-

      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 -c "import sys; sys.path.append('.'); from pmintern import store; conn = store.connect(); store.import_tracker(conn)"
          python3 cli.py scan ${{ inputs.digest && '--digest' || '' }}
          python3 cli.py urlwatch

      # Generate browsable markdown directory, jobs.json feed, & GitHub Actions Step Summary
      - name: Generate Directory & Summary
        if: always()
        run: |
          python3 -c "import sys; sys.path.append('.'); from pmintern import store; conn = store.connect(); store.export_tracker(conn)"
          python3 cli.py export-md JOBS.md
          python3 cli.py export-json web/public/jobs.json
          python3 scripts/sync_jobs.py
          python3 cli.py summary >> $GITHUB_STEP_SUMMARY

      # Upload SQLite database as an Actions artifact for 1-click download
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-database
          path: jobs.db
          retention-days: 7

      # Commit any tracker updates, fresh JOBS.md directory, and jobs.json to git
      - name: Persist tracker & directory
        if: always()
        run: |
          if [ -n "$(git status --porcelain tracker.json JOBS.md web/public/jobs.json)" ]; then
            git config user.name "internship-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add tracker.json JOBS.md web/public/jobs.json
            git commit -m "Update active jobs directory, JSON feed, and tracker state [skip ci]"
            git push
          fi

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            jobs.db
            .cache
          key: internship-state-${{ github.run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build static web app
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '' }}
        run: |
          cd web
          npm ci
          npm run build:static

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy-pages:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
